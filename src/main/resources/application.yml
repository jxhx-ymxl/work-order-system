server:
  port: 9000

spring:
  datasource:
    # connectionTimeZone 用偏移量 %2B08:00 而不是命名时区 Asia/Shanghai：
    #   MySQL 官方镜像与多数自建实例的 time_zone 表默认为空，命名时区会让连接直接失败
    #   （ERROR 1298 Unknown or incorrect time zone，本机已复现）；
    #   上海自 1991 年起无夏令时，固定 +08:00 与命名时区语义等价。
    #   前缀 %2B 是必须的：JDBC 按 application/x-www-form-urlencoded 解码参数，裸 "+" 会被解成空格。
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${DB_NAME:work_order}?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&connectionTimeZone=%2B08:00&forceConnectionTimeZoneToSession=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    # 无默认值：不再回落到 123456 这类弱口令——缺值时**连不上库**，而不是"能连上但不该连的库"。
    # 实测行为（2026-09-24）：缺该变量时应用**仍能正常启动**（Tomcat 起、Started WorkOrderApplication），
    #   失败发生在**首次访问数据库**时：CannotGetJdbcConnectionException: Failed to obtain JDBC Connection；
    #   Spring 并未因占位符缺失而中止上下文。若需要"启动即失败"，必须另加一处启动期校验（当前没有）。
    # 本地开发怎么给这个值见 README §5.5（.env / 环境变量 / IDE run config 三种方式）
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  rabbitmq:
    # 参数化：容器内后端要连服务名 rabbitmq，硬编码 localhost 会直接连不上（原写法即为此）
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    # 默认 guest 的代价是可接受的：RabbitMQ 只允许 guest 从 loopback 登录，
    # 因此"应用与 broker 同机的本地开发"能用，而容器/远程连接会被 broker 明确拒绝——
    # 它不会悄悄漏到生产。生产路径由 deploy/docker-compose.yml 传 ${RABBITMQ_PASS:?...}（无默认值）。
    password: ${RABBITMQ_PASS:guest}
    # 连接超时收紧到 3s（默认 60s）：broker 挂掉时投递任务一轮最多等这么久，
    # 而它与既有 @Scheduled 任务共用同一个调度线程，不能长时间占住。
    connection-timeout: 3000
    # 只有收到 broker 的 ack 才认为投递成功（OutboxDispatchTask 的 SENT 判定依赖它）
    publisher-confirm-type: correlated
    # 打开退回回调所需：不可路由的消息不静默消失（回调见 RabbitOutboxConfig）
    publisher-returns: true
    template:
      # ⚠ 必须是 false。实测（2026-09-24，延迟插件 3.13.0）：延迟交换机的 route/2 对
      #   **每一条**延迟消息都返回"无立即路由"，因此 mandatory=true 会给每条延迟消息都触发一次
      #   NO_ROUTE 退回（日志里表现为 replyCode=312 NO_ROUTE 的 ERROR，管理台 API 也是 routed=false）。
      #   但消息并没有丢：延迟窗口结束时它照样进了目标队列（本轮实测：t+30s 队列 0 / t+62s 队列 1）。
      #   即 mandatory=true 在这里只会制造"每条消息一条假告警"，换不来任何真实保护。
      #   真正防"发了但没人能收到"的手段是启动期声明校验（RabbitOutboxConfig.verifyDelayExchangeUsable）
      #   与投递后的队列深度核对，而不是 mandatory。
      mandatory: false
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        # 必须显式设为 false：消费失败时不要 requeue，否则失败消息被立刻重投，形成热循环把队列堵死。
        # 消费端在 P1 步骤 4 才落地，这里提前配置到位——请不要当成"本轮用不到的无用配置"删掉。
        default-requeue-rejected: false

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

sa-token:
  token-name: Authorization
  timeout: 604800
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: random-128
  is-log: false

knife4j:
  enable: true
  setting:
    language: zh-CN

xxl:
  job:
    admin:
      addresses: http://localhost:8080/xxl-job-admin
    executor:
      appname: work-order-system
      port: 9999
      logpath: /data/applogs/xxl-job/jobhandler
      logretentiondays: 30

logging:
  level:
    com.workorder: debug

llm:
  api:
    url: ${LLM_API_URL:}
    key: ${LLM_API_KEY:}
    timeout: 5000

# ============================================================
# outbox 投递任务（P1 步骤 3）
# 开关默认**关闭**：让本地与 CI 在没有 broker 的环境下也能启动与跑测试。
# 生产由 deploy/docker-compose.yml 显式置 OUTBOX_DISPATCH_ENABLED=true。
# ============================================================
workorder:
  outbox:
    dispatch:
      enabled: ${OUTBOX_DISPATCH_ENABLED:false}
      # 扫描间隔。5s 对"分钟级"的接单释放语义足够；精度问题见 D32/D36（延迟由 broker 承担）
      interval-ms: 5000
      batch-size: 100
      # SENDING 超过该分钟数无进展即视为"抢占后崩溃"，改回 PENDING。
      # 取值必须远大于单轮最坏耗时（批预算 15s），给足 20 倍余量避免重复投递。
      reclaim-minutes: 5
      confirm-timeout-ms: 5000
      # 单轮总预算（发送 + 等确认）。超预算时未尝试的记录退回 PENDING，不让调度线程被长时间占住。
      batch-budget-ms: 15000
      # 失败退避：本轮固定值，P4 换成 1m/5m/15m/1h/6h 阶梯退避 + t_message_retry
      retry-backoff-seconds: 30
      # 超过该尝试次数转 FAILED（20×30s≈10 分钟；此后工单释放语义由兜底扫描接住）
      max-attempts: 20
