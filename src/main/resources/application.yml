server:
  port: 9000

spring:
  datasource:
    # connectionTimeZone 用偏移量 %2B08:00 而不是命名时区 Asia/Shanghai：
    #   MySQL 官方镜像与多数自建实例的 time_zone 表默认为空，命名时区会让连接直接失败
    #   （ERROR 1298 Unknown or incorrect time zone，本机已复现）；
    #   上海自 1991 年起无夏令时，固定 +08:00 与命名时区语义等价。
    #   前缀 %2B 是必须的：JDBC 按 application/x-www-form-urlencoded 解码参数，裸 "+" 会被解成空格。
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${DB_NAME:work_order}?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&connectionTimeZone=%2B08:00&forceConnectionTimeZoneToSession=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

sa-token:
  token-name: Authorization
  timeout: 604800
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: random-128
  is-log: false

knife4j:
  enable: true
  setting:
    language: zh-CN

xxl:
  job:
    admin:
      addresses: http://localhost:8080/xxl-job-admin
    executor:
      appname: work-order-system
      port: 9999
      logpath: /data/applogs/xxl-job/jobhandler
      logretentiondays: 30

logging:
  level:
    com.workorder: debug

llm:
  api:
    url: ${LLM_API_URL:}
    key: ${LLM_API_KEY:}
    timeout: 5000
