# 测试期默认激活 test profile：让 src/test 下的所有 @SpringBootTest 都连 work_order_test，
# 而不是业务库 work_order。
#
# 为什么不是"只给需要真实提交的类加 @ActiveProfiles"：
#   1) 业务库的 JDBC URL 里 connectionTimeZone 用的是命名时区 Asia/Shanghai，而本机 MySQL 的
#      时区表为空（mysql.time_zone_name = 0 行），导致任何走业务库 URL 的连接直接失败
#      （ERROR 1298）。这是环境/配置问题，不是测试问题；把测试整体指向 test profile 可以绕过它，
#      同时不动生产配置。
#   2) 顺带获得更强的隔离：业务库被测试写入的可能性从"靠 @Transactional 回滚"变成"物理上不连它"。
#      （对应 INVARIANTS.md I9）
# 注意：类级 @Transactional 仍然保留——它防止测试之间在同一测试库内互相污染。
spring.profiles.active=test
