# ============================================================
# 企业工单流转平台 — Docker Compose（2C2G 瘦身版部署）
# 架构：MySQL8 + Redis7 + Spring Boot(9000) + Nginx(80, 前端+反代)
# 不含 RabbitMQ / XXL-Job —— 代码真实未接入（Mock + @Scheduled 兜底）
#
# 内存账本（2G 内从容）：
#   MySQL(buffer_pool 128M)  ~450M | Redis ~50M | App(JVM -Xmx256m) ~400M
#   Nginx ~30M | 系统底噪 ~400M  → 合计 ~1.3-1.5G
#
# 用法：见 deploy/README.md
# ============================================================

services:
  mysql:
    image: mysql:8.0
    container_name: workorder-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-WorkOrder@2026}
      MYSQL_DATABASE: work_order
      TZ: Asia/Shanghai          # 关键：容器时区=+8，与 JVM/业务对齐，避免 SLA 超时错位 8h
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=128M      # 2G 下压小 buffer pool
      - --innodb-log-buffer-size=8M
      - --max-connections=100
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动建表+种子数据（注意：文件须 utf8mb4，无 BOM）
      - ../sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-WorkOrder@2026}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: workorder-redis
    restart: unless-stopped
    # 追加持久化与内存上限，防 OOM
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..            # 后端根目录（含 Dockerfile + pom + src）
      dockerfile: Dockerfile
    container_name: workorder-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 后端 application.yml 已支持环境变量覆盖（见 src/main/resources/application.yml）
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      DB_NAME: work_order
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-WorkOrder@2026}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # LLM triage 未配 key → 自动回退默认值，不影响提交（真实设计）
      # LLM_API_URL: ""
      # LLM_API_KEY: ""
      TZ: Asia/Shanghai
    ports:
      - "9000:9000"

  frontend:
    build:
      # 独立 build context = 前端源码目录（含 package.json/src），自包含构建
      context: ../../work-order-frontend
      dockerfile: ../work-order-system/deploy/frontend.Dockerfile
    container_name: workorder-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    # 反代配置 bind mount 注入（Dockerfile 无法 COPY context 外的文件）
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mysql-data:
  redis-data:
