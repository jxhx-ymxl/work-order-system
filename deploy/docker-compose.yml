# ============================================================
# 企业工单流转平台 — Docker Compose（部署基线见 ASYNC-SCHEDULING-PLAN.md §1.4 定稿）
# 架构：MySQL8 + Redis7 + RabbitMQ3.13(自建镜像,含延迟插件) + Spring Boot(9000) + Nginx(80, 前端+反代)
#   = 5 容器。XXL-Job 将在 P2 加入（第 6 个容器），届时内存基线随之变化。
#   ⚠ 容器数量从 4 变 5 是**形态变化**：ASYNC-SCHEDULING-PLAN.md §1.6 的 4 容器实测值不再直接适用，
#      余量结论需按 §1.6.2 的上界口径重算（见该节与服务器批计划）。
#
# ⚠ 本文件**不自述内存口径与容量结论**（此处曾写机器规格与一版内存账本，与现行基线冲突，故删除）。
#   机器规格、各服务 mem_limit/堆/buffer pool 的最终值与余量口径，一律以
#   ASYNC-SCHEDULING-PLAN.md §1.4（参数基线定稿）与 §1.6.2（余量双口径）为准，不在本文件重复维护。
#
# ⚠ 人工同步点：每个服务都必须显式写 memswap_limit，且**必须等于同一服务的 mem_limit**
#   （Compose 不支持 ${mem_limit} 这类引用，Docker 也没有"swap=0"的独立开关，
#     因此"禁用容器 swap"只能靠这一对值相等来保证——调整 mem_limit 时务必同步改 memswap_limit）。
#   依据：CLAUDE.md §3 架构不变量第 12 条。
#
# 用法：见 deploy/README.md
# ============================================================

services:
  mysql:
    image: mysql:8.0
    container_name: workorder-mysql
    restart: unless-stopped
    environment:
      # 不再提供默认口令：写真实感默认值等于把口令带进公开历史。
      # 用 ${VAR:?msg} 让缺失时直接报错退出，而不是静默用空口令启动。
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?必须提供：复制 .env.example 为 .env 并填入强口令}
      MYSQL_DATABASE: work_order
      TZ: Asia/Shanghai          # 关键：容器时区=+8，与 JVM/业务对齐，避免 SLA 超时错位 8h
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M      # 基线值（P0a 收尾定稿）：按参数上界推算 4G 下余量约 1 GiB，够用
      - --innodb-log-buffer-size=8M
      - --max-connections=100
    ports:
      # 只绑本机回环：安全组若被误改，MySQL 也不会直接暴露到公网。
      # 需要远程连库时用 SSH 隧道，而不是把 0.0.0.0 放出去。
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动建表+种子数据（注意：文件须 utf8mb4，无 BOM）
      - ../sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:?必须提供 MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # ── 资源上限（ASYNC-SCHEDULING-PLAN.md v2 §1.2 / §6.3）──
    # 上限是"天花板"不是"预留"：4 容器上限之和刻意大于 4G/2 核，
    # 靠限制保证任何单容器都不能吃满整机，而不是靠"总量不超"。
    mem_limit: 1g
    # 禁用容器 swap：等于 mem_limit 表示"内存+swap 上限=内存上限"，即不给 swap 配额。
    # 理由见 README §二"为什么禁用容器 swap"——换出会让 JVM/MySQL 出现毫秒级页错误抖动，
    # 且会污染泄漏观察（RSS 不涨但 swap 在涨）。
    # ⚠ 本值必须与上面的 mem_limit 保持相等（禁用容器 swap，见 CLAUDE.md §3 第 12 条）。
    memswap_limit: 1g
    cpus: 1.0

  redis:
    image: redis:7-alpine
    container_name: workorder-redis
    restart: unless-stopped
    # 追加持久化与内存上限，防 OOM
    # 淘汰策略必须是 volatile-lru（不是 allkeys-lru）：
    # Redis 里存的不只是缓存，还有 Sa-Token 会话、驳回幂等键 token:reject:*、SLA 去重键；
    # allkeys-lru 一旦内存打满会无差别淘汰，后果是"用户被静默登出 + 去重键失效导致重复告警"。
    # volatile-lru 只淘汰带 TTL 的键，且业务键都设了 TTL。
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy volatile-lru
    ports:
      # 同 MySQL：Redis 只绑回环。它对容器网络内的 backend 仍然可达（服务名 redis:6379）。
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    # ⚠ 本值必须与上面的 mem_limit 保持相等（禁用容器 swap，见 CLAUDE.md §3 第 12 条）。
    memswap_limit: 256m
    cpus: 0.3

  rabbitmq:
    # 用自建镜像：官方 rabbitmq:3-management **不含**延迟插件，而释放检查链路依赖
    # x-delayed-message 交换机（实测官方镜像 enable 该插件报 plugins_not_found）。
    # 插件包已随仓库入库，构建期不联网下载（见 deploy/rabbitmq/README.md）。
    build:
      context: ./rabbitmq
      dockerfile: Dockerfile
    image: workorder-rabbitmq:3.13-delayed
    container_name: workorder-rabbitmq
    restart: unless-stopped
    environment:
      # 不用默认 guest：RabbitMQ 只允许 guest 从 loopback 登录，容器间连接会被拒。
      # 口令无默认值，缺失时 compose 直接报错退出。
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-workorder}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?必须提供：复制 .env.example 为 .env 并填入口令}
      TZ: Asia/Shanghai
    ports:
      # 只绑回环：管理台（15672）绝不对公网开放，需要看时用 SSH 隧道。
      # 5672 同理——容器网络内的 backend 仍可直连（服务名 rabbitmq:5672）。
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      # 内存水位/磁盘水位用绝对值（见文件内注释与方案 §1.2）
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    # ⚠ 本值必须与上面的 mem_limit 保持相等（禁用容器 swap，见 CLAUDE.md §3 第 12 条）。
    memswap_limit: 512m
    cpus: 0.4

  backend:
    build:
      context: ..            # 后端根目录（含 Dockerfile + pom + src）
      dockerfile: Dockerfile
    container_name: workorder-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      # 刻意**不**依赖 rabbitmq：outbox + 兜底扫描的设计前提就是"MQ 挂了业务照常"，
      # 若把 broker 写进启动依赖，broker 起不来就会导致整个应用不启动——那正是要避免的结局。
      # 代价：全新部署时启动校验可能先于 broker 就绪而报一条 WARN（见 RabbitOutboxConfig 的分级日志）。
    environment:
      # 后端 application.yml 已支持环境变量覆盖（见 src/main/resources/application.yml）
      # 容器内地址类变量统一用 ${VAR:-容器内服务名}：默认值就是容器网络里的正确值，
      # 而且 .env 里写了就生效（不再是"列了但 compose 没传"的死配置）。
      # ⚠ 这几个键**别在 .env 里写成 localhost**：容器里的 localhost 是容器自己，会连不上（见 D47/D57）。
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      DB_NAME: ${DB_NAME:-work_order}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?必须提供 MYSQL_ROOT_PASSWORD}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      # 默认值就是容器网络内的服务名——用 ${VAR:-默认} 而不是硬编码，
      # 否则 .env 里的 RABBITMQ_HOST 就成了"写了不生效"的死配置（D30 的同类问题）。
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-workorder}
      RABBITMQ_PASS: ${RABBITMQ_PASS:?必须提供：复制 .env.example 为 .env 并填入口令}
      # outbox 投递任务：compose 形态**默认打开**（生产必须开：不开就没有投递与消费）。
      # 用 ${VAR:-true} 而不是硬编码 "true"——否则 .env 里写 OUTBOX_DISPATCH_ENABLED=false 不生效，
      # 又是一处"列了但没接上"（D57 审计发现）。显式设 false 的场景：只想跑接口不想要消费者/投递任务。
      OUTBOX_DISPATCH_ENABLED: ${OUTBOX_DISPATCH_ENABLED:-true}
      # ── LLM（triage）：**必须传进容器**，否则容器内永远为空 → triage 每次都静默降级成 OTHER/普通 ──
      # 用 `${VAR:-}`（允许为空）而不是 `${VAR:?}`（必填）：**"LLM 不可用时提交仍成功"是设计好的降级路径**，
      # 让缺 key 直接导致服务起不来，等于把可降级依赖升级成硬依赖。
      # 代价是"没配也不报错"，因此 OrderTriageServiceImpl 加了启动期 WARN 让静默降级可见（见 D57）。
      LLM_API_URL: ${LLM_API_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      # 模型名同样要传进来：为空时代码兜底成默认模型（换模型不该改代码）
      LLM_MODEL: ${LLM_MODEL:-}
      # JVM 基线参数（P0a 收尾定稿）：目标上界值，不再是"按需上调"的待办。
      # 依据：参数有硬上界 + 按上界推算 4G 余量约 1 GiB + 目标参数下实测无 OOM（6 容器浸泡含突发压测）
      JAVA_OPTS: "-Xmx512m -Xms256m -XX:MaxMetaspaceSize=192m -XX:MaxDirectMemorySize=64m -Duser.timezone=Asia/Shanghai"
      TZ: Asia/Shanghai
    ports:
      - "9000:9000"
    # 堆参数已定为基线（见上面的 JAVA_OPTS）。服务器批用 free -m 与 docker stats 复核，
    # 若实测余量显著低于 1 GiB，再回收（下调堆或 buffer pool）。
    mem_limit: 1g
    # ⚠ 本值必须与上面的 mem_limit 保持相等（禁用容器 swap，见 CLAUDE.md §3 第 12 条）。
    memswap_limit: 1g
    cpus: 0.8

  frontend:
    build:
      # build context = 单仓内的 frontend/ 目录（含 package.json/src），自包含构建。
      # 历史上它指向仓库外的兄弟目录 ../work-order-frontend（独立 git 仓库），
      # 后果是 clone 后端仓库后 compose 构建不了前端、前端改动不进本仓库。P0b 起已并入单仓。
      context: ../frontend
      # dockerfile 路径相对 context，故为 ../deploy/frontend.Dockerfile
      dockerfile: ../deploy/frontend.Dockerfile
    container_name: workorder-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    # 反代配置 bind mount 注入（Dockerfile 无法 COPY context 外的文件）
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 64m
    # ⚠ 本值必须与上面的 mem_limit 保持相等（禁用容器 swap，见 CLAUDE.md §3 第 12 条）。
    memswap_limit: 64m
    cpus: 0.2

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
