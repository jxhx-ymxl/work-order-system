# ============================================================
# 企业工单流转平台 — Docker Compose（2C2G 瘦身版部署）
# 架构：MySQL8 + Redis7 + Spring Boot(9000) + Nginx(80, 前端+反代)
# 不含 RabbitMQ / XXL-Job —— 代码真实未接入（Mock + @Scheduled 兜底）
#
# 内存账本（2G 内从容）：
#   MySQL(buffer_pool 128M)  ~450M | Redis ~50M | App(JVM -Xmx256m) ~400M
#   Nginx ~30M | 系统底噪 ~400M  → 合计 ~1.3-1.5G
#
# ⚠ 人工同步点：每个服务都必须显式写 memswap_limit，且**必须等于同一服务的 mem_limit**
#   （Compose 不支持 ${mem_limit} 这类引用，Docker 也没有"swap=0"的独立开关，
#     因此"禁用容器 swap"只能靠这一对值相等来保证——调整 mem_limit 时务必同步改 memswap_limit）。
#   依据：CLAUDE.md §3 架构不变量第 12 条。
#
# 用法：见 deploy/README.md
# ============================================================

services:
  mysql:
    image: mysql:8.0
    container_name: workorder-mysql
    restart: unless-stopped
    environment:
      # 不再提供默认口令：写真实感默认值等于把口令带进公开历史。
      # 用 ${VAR:?msg} 让缺失时直接报错退出，而不是静默用空口令启动。
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?必须提供：复制 .env.example 为 .env 并填入强口令}
      MYSQL_DATABASE: work_order
      TZ: Asia/Shanghai          # 关键：容器时区=+8，与 JVM/业务对齐，避免 SLA 超时错位 8h
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M      # 基线值（P0a 收尾定稿）：按参数上界推算 4G 下余量约 1 GiB，够用
      - --innodb-log-buffer-size=8M
      - --max-connections=100
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动建表+种子数据（注意：文件须 utf8mb4，无 BOM）
      - ../sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:?必须提供 MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # ── 资源上限（ASYNC-SCHEDULING-PLAN.md v2 §1.2 / §6.3）──
    # 上限是"天花板"不是"预留"：4 容器上限之和刻意大于 4G/2 核，
    # 靠限制保证任何单容器都不能吃满整机，而不是靠"总量不超"。
    mem_limit: 1g
    # 禁用容器 swap：等于 mem_limit 表示"内存+swap 上限=内存上限"，即不给 swap 配额。
    # 理由见 README §二"为什么禁用容器 swap"——换出会让 JVM/MySQL 出现毫秒级页错误抖动，
    # 且会污染泄漏观察（RSS 不涨但 swap 在涨）。
    # ⚠ 本值必须与上面的 mem_limit 保持相等（1g）；调整 mem_limit 时必须同步改这一行。
    memswap_limit: 1g
    cpus: 1.0

  redis:
    image: redis:7-alpine
    container_name: workorder-redis
    restart: unless-stopped
    # 追加持久化与内存上限，防 OOM
    # 淘汰策略必须是 volatile-lru（不是 allkeys-lru）：
    # Redis 里存的不只是缓存，还有 Sa-Token 会话、驳回幂等键 token:reject:*、SLA 去重键；
    # allkeys-lru 一旦内存打满会无差别淘汰，后果是"用户被静默登出 + 去重键失效导致重复告警"。
    # volatile-lru 只淘汰带 TTL 的键，且业务键都设了 TTL。
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy volatile-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    # ⚠ 本值必须与上面的 mem_limit 保持相等（256m）；调整 mem_limit 时必须同步改这一行。
    memswap_limit: 256m
    cpus: 0.3

  backend:
    build:
      context: ..            # 后端根目录（含 Dockerfile + pom + src）
      dockerfile: Dockerfile
    container_name: workorder-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 后端 application.yml 已支持环境变量覆盖（见 src/main/resources/application.yml）
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      DB_NAME: work_order
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?必须提供 MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # LLM triage 未配 key → 自动回退默认值，不影响提交（真实设计）
      # LLM_API_URL: ""
      # LLM_API_KEY: ""
      # JVM 基线参数（P0a 收尾定稿）：目标上界值，不再是"按需上调"的待办。
      # 依据：参数有硬上界 + 按上界推算 4G 余量约 1 GiB + 目标参数下实测无 OOM（6 容器浸泡含突发压测）
      JAVA_OPTS: "-Xmx512m -Xms256m -XX:MaxMetaspaceSize=192m -XX:MaxDirectMemorySize=64m -Duser.timezone=Asia/Shanghai"
      TZ: Asia/Shanghai
    ports:
      - "9000:9000"
    # 堆参数已定为基线（见上面的 JAVA_OPTS）。服务器批用 free -m 与 docker stats 复核，
    # 若实测余量显著低于 1 GiB，再回收（下调堆或 buffer pool）。
    mem_limit: 1g
    # ⚠ 本值必须与上面的 mem_limit 保持相等（1g）；调整 mem_limit 时必须同步改这一行。
    memswap_limit: 1g
    cpus: 0.8

  frontend:
    build:
      # build context = 单仓内的 frontend/ 目录（含 package.json/src），自包含构建。
      # 历史上它指向仓库外的兄弟目录 ../work-order-frontend（独立 git 仓库），
      # 后果是 clone 后端仓库后 compose 构建不了前端、前端改动不进本仓库。P0b 起已并入单仓。
      context: ../frontend
      # dockerfile 路径相对 context，故为 ../deploy/frontend.Dockerfile
      dockerfile: ../deploy/frontend.Dockerfile
    container_name: workorder-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    # 反代配置 bind mount 注入（Dockerfile 无法 COPY context 外的文件）
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 64m
    # ⚠ 本值必须与上面的 mem_limit 保持相等（64m）；调整 mem_limit 时必须同步改这一行。
    memswap_limit: 64m
    cpus: 0.2

volumes:
  mysql-data:
  redis-data:
