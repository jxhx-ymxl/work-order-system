# ============================================================
# RabbitMQ 运行参数（由 docker-compose.yml 挂载到 /etc/rabbitmq/rabbitmq.conf）
#
# 为什么用 absolute 而不是默认的 0.4 比例：
#   内存水位默认按"容器可见总内存"的比例计算。容器里可见的内存量随宿主规格与
#   cgroup 实现而变（同镜像在小机器上算出 1.6G 水位、在大机器上算出 6G 水位），
#   结果是同一份配置在不同机器上行为不同，且**水位算错时 broker 会直接 block 住
#   所有发布连接**——表现为"应用侧全部 publish 卡死"。
#   写绝对值后，水位与 mem_limit(512m) 的关系是固定的：384M 水位 = 上限的 75%，
#   留 128M 给 management 统计与连接缓冲。
#
# 依据：ASYNC-SCHEDULING-PLAN.md §1.2 的 RabbitMQ 行（该行原文即要求 absolute）。
# ============================================================
vm_memory_high_watermark.absolute = 384MB

# 磁盘水位：系统盘 40G，低于 1GB 时 broker 会停止接收消息（避免写满盘拖垮整机）
disk_free_limit.absolute = 1GB

