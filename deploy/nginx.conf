# ============================================================
# 企业工单流转平台 — 前端 Nginx 配置
# 职责：托管 Vue3 静态产物 dist/ + 反向代理 /api 到后端容器
# ============================================================
server {
    listen 80;
    server_name _;

    # 前端静态资源根目录
    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩静态资源
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # 调查接口单独一档（§4.1 / D89）：同步调查最坏 ~30s（实测 max 29.6s），
    # 而下面 /api/ 那处是 60s——**它比"运行预算 60s"还小**，长调查会被这里先切断。
    # 只给调查接口单独配，不动全局默认值（§4.1 的硬约束）。
    location /api/agent/ {
        proxy_pass http://backend:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 包络：运行 60s < 代理 75s（< 前端 90s，待 UI 落地）
        proxy_read_timeout 75s;
    }

    # API 反向代理 → 后端服务（compose 网络内用服务名）
    location /api/ {
        proxy_pass http://backend:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Sa-Token 走 Authorization 头，无需 cookie；超时对齐后端
        proxy_read_timeout 60s;
    }

    # 前端 history 路由：非静态文件回退到 index.html（SPA 单页）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存（带 hash 的文件）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
